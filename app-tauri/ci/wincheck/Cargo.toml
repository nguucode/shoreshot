[package]
name = "shoreshot-wincheck"
version = "0.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2" }
xcap = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }
