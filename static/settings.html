<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>ShoreShot Settings</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <main>
    <section>
      <label class="label" for="hotkeyField">Capture hotkey</label>
      <div class="row">
        <button id="hotkeyField" class="hotkey" type="button"></button>
        <button id="btnReset" class="ghost" type="button">Default</button>
      </div>
      <p id="msg" class="msg" aria-live="polite"></p>
    </section>

    <section>
      <label class="check">
        <input id="enterPastes" type="checkbox" />
        <span>
          <strong>Enter / ✓ = copy and paste</strong>
          <small>After capturing, the image is pasted into the app you were using (Slack, Telegram, Figma…). When off, Enter only copies; <kbd id="pasteKey"></kbd> still copies and pastes.</small>
        </span>
      </label>
    </section>
  </main>
  <script src="../dist/renderer/settings.js"></script>
</body>
</html>
