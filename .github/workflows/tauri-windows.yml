name: tauri-windows

# Builds the Tauri app (app-tauri/) on Windows, runs its unit tests, then app-tauri/ci/run-windows.ps1:
# real hotkeys and mouse input against the app and against the Electron app on the same runner.
# Results: job summary + the windows-out artifact. Not part of the release build.
on:
  push:
    branches: ['claude/busy-torvalds-3d5f3a']
    paths: ['app-tauri/**', '.github/workflows/tauri-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri/ci/wincheck # add app-tauri/src-tauri once the app exists
      - name: Windows module unit tests
        working-directory: app-tauri/ci/wincheck
        run: cargo test
      # The steps below need the app itself (app-tauri/src-tauri from the macOS port); skipped until it exists.
      - name: Build app
        if: hashFiles('app-tauri/src-tauri/Cargo.toml') != ''
        working-directory: app-tauri
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run web --if-present
          npx tauri icon ../build/icon.png -o src-tauri/icons
          npx tauri build --bundles nsis
      - name: Build Electron app (baseline)
        if: hashFiles('app-tauri/src-tauri/Cargo.toml') != ''
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Run harness
        if: hashFiles('app-tauri/src-tauri/Cargo.toml') != ''
        shell: powershell
        run: |
          $exe = (Get-ChildItem app-tauri/src-tauri/target/release/*.exe | Select-Object -First 1).FullName
          $installer = (Get-ChildItem app-tauri/src-tauri/target/release/bundle/nsis/*.exe).FullName
          app-tauri/ci/run-windows.ps1 -Exe $exe -Installer $installer -RepoRoot $PWD `
            -TauriDataDir (Join-Path $env:APPDATA 'ShoreShot') # same config.json as Electron
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('app-tauri/src-tauri/Cargo.toml') != ''
        with:
          name: windows-out
          path: windows-out
