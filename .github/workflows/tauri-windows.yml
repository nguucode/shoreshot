name: tauri-windows

# Builds the Tauri app (app-tauri/) on Windows, runs its unit tests, then app-tauri/ci/run-windows.ps1:
# real hotkeys and mouse input against the app.
# Results: job summary + the windows-out and windows-installer artifacts. Not part of the release build.
on:
  push:
    branches: [main]
    paths: ['app-tauri/**', '.github/workflows/tauri-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app-tauri/src-tauri
      - name: Build web assets and icons
        working-directory: app-tauri
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Unit tests
        working-directory: app-tauri/src-tauri
        run: cargo test --release
      - name: Build app (NSIS)
        working-directory: app-tauri
        run: npx tauri build --bundles nsis
      - name: Run harness
        shell: powershell
        run: |
          $installer = (Get-ChildItem app-tauri/src-tauri/target/release/bundle/nsis/*.exe).FullName
          app-tauri/ci/run-windows.ps1 -Exe app-tauri/src-tauri/target/release/shoreshot.exe `
            -Installer $installer -TauriDataDir (Join-Path $env:APPDATA 'ShoreShot')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-out
          path: windows-out
      - uses: actions/upload-artifact@v4 # the installer of this branch, to try by hand
        if: always()
        with:
          name: windows-installer
          path: app-tauri/src-tauri/target/release/bundle/nsis/*.exe
