name: build

# Phát hành: push tag v* (vd: v0.1.0), HOẶC vào tab Actions > build > Run workflow > tick "release".
#   -> build macOS + Windows -> tạo GitHub Release (tag = v + version trong package.json).
# Run workflow không tick "release" -> chỉ build, file nằm ở mục Artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Tạo GitHub Release (tag v<version trong package.json>)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      # node-screenshots chỉ cài binary đúng kiến trúc máy build (runner mac là arm64): thêm bản x64 cho file Intel.
      - if: runner.os == 'macOS'
        run: npm install --no-save --no-audit --no-fund --force "node-screenshots-darwin-x64@$(node -p "require('node-screenshots/package.json').version")"
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: shoreshot-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*-mac-*.zip
            release/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Cài đặt

            **macOS** (Terminal):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
            ```
            **Windows** (PowerShell):
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex
            ```

            Hoặc tải tay bên dưới:
            - Mac Apple Silicon (M1/M2/M3/M4): `ShoreShot-*-mac-arm64.dmg`
            - Mac Intel: `ShoreShot-*-mac-x64.dmg`
            - Windows: `ShoreShot-Setup-*.exe`

            App chưa ký số. macOS báo "damaged / không mở được" thì chạy: `xattr -cr /Applications/ShoreShot.app`. Windows SmartScreen: More info > Run anyway.
