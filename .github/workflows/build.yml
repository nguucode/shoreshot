name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npx electron-builder --publish never ${{ matrix.os == 'macos-latest' && '--mac' || '--win' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: shoreshot-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
