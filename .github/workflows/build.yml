name: build

# Push tag v* (vd: v0.1.0) -> build macOS + Windows -> đăng GitHub Release.
# Bấm "Run workflow" thủ công -> chỉ build, file nằm ở mục Artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: shoreshot-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*-mac-*.zip
            release/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Cài đặt

            **macOS** (Terminal):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
            ```
            **Windows** (PowerShell):
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex
            ```

            Hoặc tải tay bên dưới:
            - Mac Apple Silicon (M1/M2/M3/M4): `ShoreShot-*-mac-arm64.dmg`
            - Mac Intel: `ShoreShot-*-mac-x64.dmg`
            - Windows: `ShoreShot-Setup-*.exe`

            App chưa ký số. macOS báo "damaged / không mở được" thì chạy: `xattr -cr /Applications/ShoreShot.app`. Windows SmartScreen: More info > Run anyway.
