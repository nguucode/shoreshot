name: spike-windows

# Throwaway: builds the Tauri spike (spike/tauri) on Windows and runs ci/run-windows.ps1, which presses the
# real hotkey and compares it with the Electron app on the same runner. Results: job summary + artifact.
on:
  push:
    branches: ['claude/tauri-windows-spike', 'claude/tauri-win-sharedbuffer']
    paths: ['spike/tauri/**', '.github/workflows/spike-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike/tauri/src-tauri
      - name: Build spike
        working-directory: spike/tauri
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run web
          npx tauri icon ../../build/icon.png -o src-tauri/icons
          npx tauri build --bundles nsis
      - name: Build Electron app (baseline)
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Run harness
        shell: powershell
        run: |
          $installer = (Get-ChildItem spike/tauri/src-tauri/target/release/bundle/nsis/*.exe).FullName
          spike/tauri/ci/run-windows.ps1 -Exe spike/tauri/src-tauri/target/release/shoreshot-spike.exe `
            -Installer $installer -RepoRoot $PWD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-windows
          path: spike-out
